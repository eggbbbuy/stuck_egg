<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 正2 + 現金 Beta 攤平計算機</title>
<style>
  :root{ --bg:#0f1420; --card:#1a2233; --line:#2b3550; --txt:#e8edf6; --sub:#95a3bd;
         --buy:#22c55e; --sell:#ef4444; --acc:#3b82f6; --warn:#f59e0b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
       padding:16px;max-width:760px;margin:0 auto;-webkit-text-size-adjust:100%}
  h1{font-size:19px;margin:4px 0 2px}
  .sub{color:var(--sub);font-size:12px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  input,select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);
        background:#0d1320;color:var(--txt);font-size:15px}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  .hint{font-size:11px;color:var(--sub);margin-top:3px}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .kv{background:#0d1320;border:1px solid var(--line);border-radius:10px;padding:10px}
  .kv .k{font-size:11px;color:var(--sub)}
  .kv .v{font-size:17px;font-weight:700;margin-top:2px}
  .advice{border-radius:12px;padding:14px;font-size:15px;line-height:1.5;margin-bottom:14px;border:1px solid}
  .advice.buy{background:rgba(34,197,94,.12);border-color:var(--buy)}
  .advice.wait{background:rgba(59,130,246,.10);border-color:var(--acc)}
  .advice.full{background:rgba(245,158,11,.12);border-color:var(--warn)}
  .advice b{font-size:18px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--sub);font-weight:600;font-size:11px}
  td.l,th.l{text-align:left}
  tr.done{background:rgba(34,197,94,.08)}
  tr.now{background:rgba(245,158,11,.14)}
  .tag{font-size:10px;padding:1px 6px;border-radius:6px}
  .tag.d{background:var(--buy);color:#04210f}
  .tag.w{background:#33415c;color:var(--sub)}
  .scroll{overflow-x:auto}
  .pos{color:var(--buy)} .neg{color:var(--sell)}
  .foot{font-size:11px;color:var(--sub);line-height:1.5;margin-top:6px}
</style>
</head>
<body>
  <h1>⚖️ 正2 + 現金　Beta 攤平計算機</h1>
  <div class="sub">餵入你的持有成本，自動算「跌到多少價、買幾張、累計成本、新均價、剩多少現金」。純試算，非投資建議。</div>

  <div class="card">
    <div class="grid">
      <div><label>目前持股（張，1張=1000股）</label><input id="qty" type="number" value="6" step="1"></div>
      <div><label>目前平均成本（元/股）</label><input id="avg" type="number" value="33.91" step="0.01"></div>
      <div><label>目前市價（元/股）</label><input id="mkt" type="number" value="28.53" step="0.01"></div>
      <div><label>正2 資金上限（總投入成本，元）</label><input id="cap" type="number" value="600000" step="10000"><div class="hint">60萬進場、另留40萬現金</div></div>
      <div><label>每跌幾 % 攤平一次</label><input id="drop" type="number" value="15" step="1"></div>
      <div><label>每次加碼張數</label><input id="add" type="number" value="1" step="1"></div>
      <div>
        <label>跌幅從哪裡起算</label>
        <select id="ref">
          <option value="avg" selected>平均成本往下</option>
          <option value="mkt">目前市價往下</option>
        </select>
      </div>
      <div><label>保留現金（顯示用，元）</label><input id="reserve" type="number" value="400000" step="10000"></div>
    </div>
  </div>

  <div id="advice" class="advice wait"></div>

  <div class="card">
    <div class="summary" id="summary"></div>
  </div>

  <div class="card">
    <div style="font-size:13px;color:var(--sub);margin-bottom:2px">攤平階梯表（每跌一階買一次）</div>
    <div class="scroll">
      <table id="tbl">
        <thead><tr>
          <th class="l">階</th><th>觸發價</th><th>距今跌幅</th><th>買進(張)</th><th>該筆金額</th>
          <th>累計張數</th><th>累計投入</th><th>新均價</th><th>剩餘可投入</th><th class="l">狀態</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="foot">
      「累計投入」達資金上限就停止。「狀態」＝目前市價是否已跌到該價位。<br>
      ⚠️ 正2是2倍槓桿ETF，長空/盤整有槓桿耗損，攤平不保證回本；資金上限＝別超過100萬中的60萬。此頁為試算工具、非投資建議。
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
const nf=n=>Math.round(n).toLocaleString('en-US');
const SH=1000; // 股/張
function calc(){
  const qty0=+$('qty').value||0, avg=+$('avg').value||0, mkt=+$('mkt').value||0;
  const cap=+$('cap').value||0, dropPct=(+$('drop').value||0)/100, add=+$('add').value||0;
  const refMode=$('ref').value, reserve=+$('reserve').value||0;

  const startPrice = refMode==='avg'? avg : mkt;
  let cumQty=qty0, cumCost=qty0*SH*avg;          // 從現有持股起算
  const rows=[]; let price=startPrice, i=0;

  // 第0列：現有持股
  rows.push({step:0, price:avg, drop:null, buyLots:qty0, amt:qty0*SH*avg,
             cumQty, cumCost, newAvg:avg, left:cap-cumCost, hold:true});

  while(i<12 && add>0){
    price = price*(1-dropPct);
    if(price < startPrice*0.2) break;             // 跌超過80%就不再往下列（不切實際）
    const amt = price*SH*add;
    if(cumCost+amt > cap) break;                  // 超過資金上限就停
    cumQty += add; cumCost += amt; i++;
    const dropFromMkt = mkt>0? (price/mkt-1) : 0;
    rows.push({step:i, price, drop:dropFromMkt, buyLots:add, amt,
               cumQty, cumCost, newAvg:cumCost/(cumQty*SH), left:cap-cumCost,
               reached: mkt>0 && mkt<=price+1e-9});
  }

  // 找「下一個買點」= 市價尚未跌到的第一個階（狀態=等待中，價最高者）
  let nextRow=null, buyNowRow=null;
  for(let k=1;k<rows.length;k++){
    if(rows[k].reached){ buyNowRow=rows[k]; }      // 已到價（可買）
    else { nextRow=rows[k]; break; }
  }

  // 建議框
  const adv=$('advice');
  if(rows.length<=1){
    adv.className='advice full';
    adv.innerHTML='資金上限已被現有持股用滿（或每次加碼張數為0），沒有可攤平的空間。';
  } else if(buyNowRow){
    adv.className='advice buy';
    adv.innerHTML=`✅ <b>現在就到買點了</b><br>目前市價 $${mkt} 已跌到第 ${buyNowRow.step} 階（$${buyNowRow.price.toFixed(2)}）。`+
      `建議買進 <b>${buyNowRow.buyLots} 張</b>（約 $${nf(buyNowRow.buyLots*SH*mkt)}）。`+
      (nextRow? `<br>下一階買點：$${nextRow.price.toFixed(2)}（再跌 ${(Math.abs(nextRow.drop)*100).toFixed(1)}%）`:'');
  } else if(nextRow){
    adv.className='advice wait';
    const need=(1-nextRow.price/mkt)*100;
    adv.innerHTML=`⏳ <b>還沒到買點</b><br>目前市價 $${mkt}。下一個攤平點：<b>$${nextRow.price.toFixed(2)}</b>`+
      `（再跌約 ${need.toFixed(1)}%）→ 到價買 ${nextRow.buyLots} 張（約 $${nf(nextRow.buyLots*SH*nextRow.price)}）。`;
  } else {
    adv.className='advice full';
    adv.innerHTML='📦 <b>資金上限已排滿</b>，階梯表已列到 60 萬用完為止。';
  }

  // 用不滿上限的提醒
  const maxInvest=rows[rows.length-1].cumCost;
  if(rows.length>1 && maxInvest < cap*0.98){
    adv.innerHTML += `<br><span style="color:var(--warn)">⚠️ 此設定（每跌 ${(+$('drop').value)}% 買 ${add} 張）最多只投入約 $${nf(maxInvest)}，用不滿上限 $${nf(cap)}。想用滿 → 調高「每次加碼張數」或縮小「每跌 %」。</span>`;
  }

  // 摘要
  const lastPlan=rows[rows.length-1];
  const curVal=qty0*SH*mkt, curCost=qty0*SH*avg, pl=curVal-curCost;
  $('summary').innerHTML=`
    <div class="kv"><div class="k">目前持股市值</div><div class="v">$${nf(curVal)}</div></div>
    <div class="kv"><div class="k">目前未實現損益</div><div class="v ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}$${nf(pl)} (${(pl/curCost*100).toFixed(1)}%)</div></div>
    <div class="kv"><div class="k">若排滿：累計張數</div><div class="v">${lastPlan.cumQty} 張</div></div>
    <div class="kv"><div class="k">若排滿：累計投入</div><div class="v">$${nf(lastPlan.cumCost)}</div></div>
    <div class="kv"><div class="k">若排滿：最終均價</div><div class="v">$${lastPlan.newAvg.toFixed(2)}</div></div>
    <div class="kv"><div class="k">保留現金</div><div class="v">$${nf(reserve)}</div></div>`;

  // 表格
  const tb=$('tbl').querySelector('tbody'); tb.innerHTML='';
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    let statusHtml, cls='';
    if(r.hold){ statusHtml='<span class="tag w">現有持股</span>'; }
    else if(r.reached){ statusHtml='<span class="tag d">✅已到價</span>'; cls=(r===buyNowRow)?'now':'done'; }
    else { statusHtml='<span class="tag w">⏳等跌到</span>'; }
    tr.className=cls;
    tr.innerHTML=`<td class="l">${r.hold?'持有':r.step}</td>
      <td>$${r.price.toFixed(2)}</td>
      <td>${r.drop==null?'—':(r.drop*100).toFixed(1)+'%'}</td>
      <td>${r.buyLots}</td>
      <td>$${nf(r.amt)}</td>
      <td>${r.cumQty}</td>
      <td>$${nf(r.cumCost)}</td>
      <td>$${r.newAvg.toFixed(2)}</td>
      <td>$${nf(r.left)}</td>
      <td class="l">${statusHtml}</td>`;
    tb.appendChild(tr);
  });
}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',calc));
calc();
</script>
</body>
</html>
