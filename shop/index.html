<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選品倉庫 · Daytona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#e0281e;--ink:#111;--sub:#8a8a8a;--line:#eee;--bg:#fafafa;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .head-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px;}
  .logo small{font-weight:500;color:var(--sub);font-size:12px;margin-left:8px;}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,.toggle{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:999px;background:#fff;cursor:pointer;color:var(--ink);}
  .toggle.on{background:var(--red);color:#fff;border-color:var(--red);}
  .count{font-size:12px;color:var(--sub);width:100%;max-width:1280px;margin:0 auto;padding:8px 20px 0;}
  main{max-width:1280px;margin:0 auto;padding:14px 16px 60px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px;}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr);}}
  .card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #f0f0f0;transition:.18s;display:flex;flex-direction:column;}
  .card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px);}
  .thumb{position:relative;aspect-ratio:1/1.18;background:#f3f3f3;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s;}
  .thumb img.alt{position:absolute;inset:0;opacity:0;}
  .card:hover .thumb img.alt{opacity:1;}
  .badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;}
  .cat-tag{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;}
  .info{padding:11px 12px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .brand{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .name{font-size:13px;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
  .colors{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  .cchip{font-size:10px;color:#777;background:#f3f3f3;padding:2px 6px;border-radius:5px;}
  .price{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .now{font-weight:700;font-size:16px;}.now.sale{color:var(--red);}
  .was{font-size:12px;color:#aaa;text-decoration:line-through;}
  .off{font-size:11px;font-weight:700;color:var(--red);}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:30px;}
  .loading{text-align:center;color:var(--sub);padding:60px;font-size:14px;}
  /* modal */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 14px;}
  .modal.open{display:block;}
  .sheet{background:#fff;border-radius:14px;max-width:1040px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr;position:relative;}
  @media(min-width:820px){.sheet{grid-template-columns:1.1fr .9fr;align-items:start;}}
  .m-gallery{padding:20px;background:#fff;min-width:0;}
  .m-main{width:100%;height:420px;display:flex;align-items:center;justify-content:center;background:#f6f6f6;border-radius:10px;overflow:hidden;}
  @media(min-width:820px){.m-main{height:520px;}}
  .m-main img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;margin:auto;}
  .m-thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px;}
  .m-thumbs img{width:56px;height:66px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid #eee;flex:0 0 auto;}
  .m-thumbs img.sel{border-color:var(--ink);}
  .m-info{padding:24px 26px 28px;position:relative;min-width:0;}
  @media(min-width:820px){.m-info{border-left:1px solid #f0f0f0;}}
  .m-close{position:absolute;top:12px;right:14px;font-size:30px;line-height:1;color:#bbb;cursor:pointer;background:none;border:none;z-index:2;}
  .m-brand{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .m-name{font-size:21px;font-weight:600;line-height:1.45;margin:8px 30px 14px 0;color:#1b3a6b;}
  .m-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .m-now{font-weight:800;font-size:26px;}.m-now.sale{color:var(--red);}
  .m-was{font-size:16px;color:#aaa;text-decoration:line-through;}
  .m-off{font-size:13px;font-weight:700;color:#fff;background:var(--red);padding:2px 8px;border-radius:6px;}
  .m-sku{font-size:12px;color:#aaa;margin:2px 0 20px;padding-bottom:18px;border-bottom:1px solid #eee;}
  .m-sec{margin-bottom:20px;}
  .m-label{font-size:13px;color:#333;margin-bottom:9px;}.m-label b{font-weight:700;}
  .m-opts{display:flex;gap:9px;flex-wrap:wrap;}
  .m-opt{font-size:14px;min-width:52px;text-align:center;padding:9px 15px;border:1px solid #ccc;border-radius:4px;background:#fff;color:#222;cursor:pointer;user-select:none;}
  .m-opt.first{border-color:#111;border-width:2px;}
  .m-chart{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;}
  .m-chart th,.m-chart td{border:1px solid #eee;padding:7px 9px;text-align:center;white-space:nowrap;}
  .m-chart thead th{background:#1a1a1a;color:#fff;font-weight:700;}
  .m-chart tbody td:first-child{font-weight:700;background:#f4f4f4;}
  .m-chart-wrap{overflow-x:auto;}
  .m-cta{display:block;width:100%;text-align:center;margin-top:16px;background:#c0563f;color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:6px;text-decoration:none;letter-spacing:1px;}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="logo">選品倉庫<small>Daytona</small></div>
    <div class="controls">
      <div class="toggle" id="saleToggle">🔥 只看特價</div>
      <select id="catSel"></select>
      <select id="brandSel"></select>
      <select id="sortSel">
        <option value="new">預設(新到舊)</option>
        <option value="off">折扣多→少</option>
        <option value="plow">價格低→高</option>
        <option value="phigh">價格高→低</option>
      </select>
    </div>
  </div>
  <div class="count" id="count"></div>
</header>
<main><div class="grid" id="grid"></div><div class="loading" id="loading">載入商品中…</div></main>
<footer>資料來源：Daytona Park · 價格以官網為準</footer>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const LINE_URL='https://line.me/R/ti/p/%40344mwpgw';
let DATA=[], view=[], onlySale=false;
const $=id=>document.getElementById(id);
const grid=$('grid'),catSel=$('catSel'),brandSel=$('brandSel'),sortSel=$('sortSel'),saleT=$('saleToggle'),countEl=$('count'),modal=$('modal'),sheet=$('sheet');
const yen=n=>'¥'+Number(n).toLocaleString();
const pct=p=>p.off||(p.orig&&p.price&&p.orig>p.price?Math.round((1-p.price/p.orig)*100):0);
const cols=p=>(p.colors&&p.colors.length?p.colors:[]);
fetch('products.json').then(r=>r.json()).then(d=>{DATA=d;$('loading').style.display='none';initFilters();render();})
  .catch(e=>{$('loading').textContent='載入失敗：'+e;});
function initFilters(){
  const cats=[...new Set(DATA.map(p=>p.cat).filter(Boolean))].sort();
  catSel.innerHTML='<option value="">全部分類</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  const brands=[...new Set(DATA.map(p=>p.brand).filter(Boolean))].sort();
  brandSel.innerHTML='<option value="">全部品牌</option>'+brands.map(b=>`<option value="${b}">${b}</option>`).join('');
}
function render(){
  let list=DATA.slice();
  if(onlySale)list=list.filter(p=>p.on_sale);
  if(catSel.value)list=list.filter(p=>p.cat===catSel.value);
  if(brandSel.value)list=list.filter(p=>p.brand===brandSel.value);
  const s=sortSel.value;
  if(s==='off')list.sort((a,b)=>pct(b)-pct(a));
  else if(s==='plow')list.sort((a,b)=>a.price-b.price);
  else if(s==='phigh')list.sort((a,b)=>b.price-a.price);
  view=list;
  countEl.textContent=`共 ${list.length} 件`+(onlySale?'（特價中）':'');
  grid.innerHTML=list.map((p,i)=>{
    const off=pct(p),c=cols(p);
    const chips=c.slice(0,4).map(x=>`<span class="cchip">${x}</span>`).join('')+(c.length>4?`<span class="cchip">+${c.length-4}</span>`:'');
    const ph=off>0?`<span class="now sale">${yen(p.price)}</span><span class="was">${yen(p.orig)}</span><span class="off">-${off}%</span>`:`<span class="now">${yen(p.price)}</span>`;
    return `<div class="card" onclick="openM(${i})"><div class="thumb">${off>0?`<span class="badge">-${off}%</span>`:''}${p.cat?`<span class="cat-tag">${p.cat}</span>`:''}
      <img loading="lazy" src="${p.images[0]}"><img class="alt" loading="lazy" src="${p.images[1]||p.images[0]}"></div>
      <div class="info"><div class="brand">${p.brand||''}</div><div class="name">${p.title||''}</div>
      <div class="colors">${chips}</div><div class="price">${ph}</div></div></div>`;
  }).join('');
}
function chartHtml(sc){
  if(!sc||!sc.rows||!sc.rows.length)return '';
  const th=sc.headers.map(h=>`<th>${h}</th>`).join('');
  const tb=sc.rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  return `<div class="m-sec"><div class="m-label"><b>尺寸表</b>（cm）</div><div class="m-chart-wrap"><table class="m-chart"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div></div>`;
}
function openM(i){
  const p=view[i],off=pct(p),c=cols(p);
  const ph=off>0?`<span class="m-now sale">${yen(p.price)}</span><span class="m-was">${yen(p.orig)}</span><span class="m-off">-${off}%</span>`:`<span class="m-now">${yen(p.price)}</span>`;
  const colHtml=c.length?`<div class="m-sec"><div class="m-label">顏色：<b class="selVal" data-g="c">${c[0]}</b></div><div class="m-opts">${c.map((x,j)=>`<span class="m-opt${j===0?' first':''}" onclick="selOpt(this,'c')">${x}</span>`).join('')}</div></div>`:'';
  const szHtml=(p.sizes&&p.sizes.length)?`<div class="m-sec"><div class="m-label">尺寸：<b class="selVal" data-g="s">${p.sizes[0]}</b></div><div class="m-opts">${p.sizes.map((x,j)=>`<span class="m-opt${j===0?' first':''}" onclick="selOpt(this,'s')">${x}</span>`).join('')}</div></div>`:'';
  const thumbs=p.images.map((im,j)=>`<img src="${im}" class="${j===0?'sel':''}" onclick="swap(this,'${im}')">`).join('');
  sheet.innerHTML=`<div class="m-gallery"><div class="m-main"><img id="mMain" src="${p.images[0]}"></div><div class="m-thumbs">${thumbs}</div></div>
    <div class="m-info"><button class="m-close" onclick="closeM()">×</button>
    <div class="m-brand">${p.brand||''}${p.cat?' · '+p.cat:''}</div><div class="m-name">${p.title||''}</div>
    <div class="m-price">${ph}</div><div class="m-sku">商品編號：${p.id||''}</div>
    ${colHtml}${szHtml}${chartHtml(p.size_chart)}
    <a class="m-cta" href="${LINE_URL}" target="_blank" rel="noopener">送出訂購單（轉導LINE）</a></div>`;
  modal.classList.add('open');document.body.style.overflow='hidden';
}
function selOpt(el,g){[...el.parentElement.children].forEach(t=>t.classList.remove('first'));el.classList.add('first');const l=document.querySelector(`.selVal[data-g="${g}"]`);if(l)l.textContent=el.textContent;}
function swap(el,src){$('mMain').src=src;[...el.parentElement.children].forEach(t=>t.classList.remove('sel'));el.classList.add('sel');}
function closeM(){modal.classList.remove('open');document.body.style.overflow='';}
modal.onclick=e=>{if(e.target===modal)closeM();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
saleT.onclick=()=>{onlySale=!onlySale;saleT.classList.toggle('on',onlySale);render();};
catSel.onchange=render;brandSel.onchange=render;sortSel.onchange=render;
</script>
</body>
</html>
