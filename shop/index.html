<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選品倉庫 · Daytona 新品／特價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#e0281e;--ink:#111;--sub:#8a8a8a;--line:#eee;--bg:#fafafa;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .head-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px;}
  .logo small{font-weight:500;color:var(--sub);font-size:12px;margin-left:8px;}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,.toggle{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:999px;background:#fff;cursor:pointer;color:var(--ink);}
  .toggle.on{background:var(--red);color:#fff;border-color:var(--red);}
  .count{font-size:12px;color:var(--sub);width:100%;max-width:1280px;margin:0 auto;padding:8px 20px 0;}
  main{max-width:1280px;margin:0 auto;padding:14px 16px 60px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px;}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr);}}
  .card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #f0f0f0;transition:.18s;display:flex;flex-direction:column;}
  .card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px);}
  .thumb{position:relative;aspect-ratio:1/1.18;background:#f3f3f3;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s;}
  .thumb img.alt{position:absolute;inset:0;opacity:0;}
  .card:hover .thumb img.alt{opacity:1;}
  .badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;letter-spacing:.5px;}
  .info{padding:11px 12px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .brand{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .name{font-size:13px;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
  .colors{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  .cchip{font-size:10px;color:#777;background:#f3f3f3;padding:2px 6px;border-radius:5px;}
  .price{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .now{font-weight:700;font-size:16px;}
  .now.sale{color:var(--red);}
  .was{font-size:12px;color:#aaa;text-decoration:line-through;}
  .off{font-size:11px;font-weight:700;color:var(--red);}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:30px;}
  /* modal */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;}
  .modal.open{display:flex;}
  .sheet{background:#fff;border-radius:16px;max-width:960px;width:100%;overflow:hidden;display:grid;grid-template-columns:1fr;}
  @media(min-width:760px){.sheet{grid-template-columns:1.1fr 1fr;}}
  .m-gallery{background:#f4f4f4;padding:14px;}
  .m-main{width:100%;aspect-ratio:1/1.15;background:#eee;border-radius:10px;overflow:hidden;}
  .m-main img{width:100%;height:100%;object-fit:cover;}
  .m-thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;}
  .m-thumbs img{width:60px;height:72px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;flex:0 0 auto;}
  .m-thumbs img.sel{border-color:var(--ink);}
  .m-info{padding:22px 22px 26px;position:relative;}
  .m-close{position:absolute;top:14px;right:16px;font-size:26px;line-height:1;color:#999;cursor:pointer;background:none;border:none;}
  .m-brand{font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .m-name{font-size:19px;font-weight:600;line-height:1.4;margin:6px 0 14px;}
  .m-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .m-now{font-weight:800;font-size:24px;}.m-now.sale{color:var(--red);}
  .m-was{font-size:15px;color:#aaa;text-decoration:line-through;}
  .m-off{font-size:13px;font-weight:700;color:#fff;background:var(--red);padding:2px 8px;border-radius:6px;}
  .m-sec{margin-bottom:18px;}
  .m-label{font-size:12px;font-weight:700;color:#666;margin-bottom:8px;letter-spacing:.5px;}
  .m-opts{display:flex;gap:8px;flex-wrap:wrap;}
  .m-opt{font-size:13px;padding:7px 13px;border:1px solid #ddd;border-radius:8px;background:#fff;}
  .m-src{display:inline-block;margin-top:8px;font-size:12px;color:#aaa;text-decoration:none;}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="logo">選品倉庫<small>Daytona 新品 · 特價追蹤</small></div>
    <div class="controls">
      <div class="toggle" id="saleToggle">🔥 只看特價</div>
      <select id="brandSel"></select>
      <select id="sortSel">
        <option value="new">預設(新到舊)</option>
        <option value="off">折扣多→少</option>
        <option value="plow">價格低→高</option>
        <option value="phigh">價格高→低</option>
      </select>
    </div>
  </div>
  <div class="count" id="count"></div>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>資料來源：Daytona Park（示範用）· 價格以官網為準</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

om/items/original/3200375300004/item6a66ae30192cd.jpg", "https://images.daytona-park.com/items/original/3200375300004/item6a66ae2fb4614.jpg", "https://images.daytona-park.com/items/original/3200375300004/item6a66ae3071dcd.jpg"], "price": 7997, "orig": 7997, "on_sale": false, "off": 0, "sizes": ["FREE"], "colors_zh": ["オフホワイト/チェック", "サックス/ストライプ", "ネイビー/チェック"]}];
const grid=document.getElementById('grid'), brandSel=document.getElementById('brandSel'),
      sortSel=document.getElementById('sortSel'), saleT=document.getElementById('saleToggle'), countEl=document.getElementById('count'),
      modal=document.getElementById('modal'), sheet=document.getElementById('sheet');
let onlySale=false, view=[];
const brands=[...new Set(DATA.map(p=>p.brand).filter(Boolean))].sort();
brandSel.innerHTML='<option value="">全部品牌</option>'+brands.map(b=>`<option value="${b}">${b}</option>`).join('');
const yen=n=>'¥'+Number(n).toLocaleString();
function pct(p){return p.off||(p.orig&&p.price&&p.orig>p.price?Math.round((1-p.price/p.orig)*100):0);}
function cols(p){return (p.colors_zh&&p.colors_zh.length?p.colors_zh:(p.colors||[]));}
function render(){
  let list=DATA.slice();
  if(onlySale) list=list.filter(p=>p.on_sale);
  const bv=brandSel.value; if(bv) list=list.filter(p=>p.brand===bv);
  const s=sortSel.value;
  if(s==='off') list.sort((a,b)=>pct(b)-pct(a));
  else if(s==='plow') list.sort((a,b)=>a.price-b.price);
  else if(s==='phigh') list.sort((a,b)=>b.price-a.price);
  view=list;
  countEl.textContent=`共 ${list.length} 件`+(onlySale?'（特價中）':'');
  grid.innerHTML=list.map((p,idx)=>{
    const off=pct(p), c=cols(p);
    const chips=c.slice(0,4).map(x=>`<span class="cchip">${x}</span>`).join('')+(c.length>4?`<span class="cchip">+${c.length-4}</span>`:'');
    const ph=off>0?`<span class="now sale">${yen(p.price)}</span><span class="was">${yen(p.orig)}</span><span class="off">-${off}%</span>`:`<span class="now">${yen(p.price)}</span>`;
    return `<div class="card" onclick="openM(${idx})">
      <div class="thumb">${off>0?`<span class="badge">-${off}%</span>`:''}
        <img loading="lazy" src="${p.images[0]}"><img class="alt" loading="lazy" src="${p.images[1]||p.images[0]}"></div>
      <div class="info"><div class="brand">${p.brand||''}</div><div class="name">${p.title||''}</div>
        <div class="colors">${chips}</div><div class="price">${ph}</div></div></div>`;
  }).join('');
}
function openM(idx){
  const p=view[idx], off=pct(p), c=cols(p);
  const ph=off>0?`<span class="m-now sale">${yen(p.price)}</span><span class="m-was">${yen(p.orig)}</span><span class="m-off">-${off}%</span>`:`<span class="m-now">${yen(p.price)}</span>`;
  const colHtml=c.length?`<div class="m-sec"><div class="m-label">顏色（${c.length}色）</div><div class="m-opts">${c.map(x=>`<span class="m-opt">${x}</span>`).join('')}</div></div>`:'';
  const szHtml=(p.sizes&&p.sizes.length)?`<div class="m-sec"><div class="m-label">尺寸</div><div class="m-opts">${p.sizes.map(x=>`<span class="m-opt">${x}</span>`).join('')}</div></div>`:'';
  const thumbs=p.images.map((im,i)=>`<img src="${im}" class="${i===0?'sel':''}" onclick="swap(this,'${im}')">`).join('');
  sheet.innerHTML=`
    <div class="m-gallery"><div class="m-main"><img id="mMain" src="${p.images[0]}"></div>
      <div class="m-thumbs">${thumbs}</div></div>
    <div class="m-info"><button class="m-close" onclick="closeM()">×</button>
      <div class="m-brand">${p.brand||''}</div><div class="m-name">${p.title||''}</div>
      <div class="m-price">${ph}</div>${colHtml}${szHtml}
      <a class="m-src" href="${p.url}" target="_blank" rel="noopener">在 Daytona 查看原頁 ↗</a></div>`;
  modal.classList.add('open');document.body.style.overflow='hidden';
}
function swap(el,src){document.getElementById('mMain').src=src;[...el.parentElement.children].forEach(t=>t.classList.remove('sel'));el.classList.add('sel');}
function closeM(){modal.classList.remove('open');document.body.style.overflow='';}
modal.onclick=e=>{if(e.target===modal)closeM();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
saleT.onclick=()=>{onlySale=!onlySale;saleT.classList.toggle('on',onlySale);render();};
brandSel.onchange=render; sortSel.onchange=render;
render();
</script>
