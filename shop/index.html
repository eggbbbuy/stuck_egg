<script>
const LINE_URL='https://line.me/R/ti/p/%40344mwpgw';
let DATA=[], view=[], onlySale=false, curPage=1;
const PER=100;
const SHARDS={};
const $=id=>document.getElementById(id);
const grid=$('grid'),genSel=$('genSel'),brandInput=$('brandInput'),brandList=$('brandList'),catList=$('catList'),sortBtn=$('sortBtn'),sortPop=$('sortPop'),saleT=$('saleToggle'),countEl=$('count'),modal=$('modal'),sheet=$('sheet'),menuOverlay=$('menuOverlay');
let ALL_BRANDS=[], selBrand='', selBrandLabel='', selCat='', searchQ='', sortVal='new';
const yen=n=>'¥'+Number(n).toLocaleString();
const pct=p=>p.off||(p.orig&&p.price&&p.orig>p.price?Math.round((1-p.price/p.orig)*100):0);
const cols=p=>(p.colors&&p.colors.length?p.colors:[]);
// 商品圖:清單只存檔名,這裡組回完整網址(省流量)
const IMGBASE='https://images.daytona-park.com/items/original/';
function cimg(p,fn){return (fn&&fn.slice(0,4)==='http')?fn:IMGBASE+p.id+'/'+fn;}
// 卡片圖:一開始每張卡只載第一張,滑動該卡才載其餘(省流量+避免記憶體爆掉)
function loadStrip(s){s.querySelectorAll('img[data-src]').forEach(im=>{im.src=im.getAttribute('data-src');im.removeAttribute('data-src');});}
function cgScroll(e,btn,dir){e.preventDefault();e.stopPropagation();const s=btn.parentElement.querySelector('.cg-strip');loadStrip(s);s.scrollBy({left:dir*s.clientWidth,behavior:'smooth'});}
function cgCount(s){const n=s.children.length,i=Math.min(n,Math.round(s.scrollLeft/s.clientWidth)+1);const c=s.parentElement.querySelector('.cg-count');if(c)c.textContent=i+'/'+n;}
function onStrip(s){loadStrip(s);cgCount(s);}
function pickSort(v){sortVal=v;document.querySelectorAll('.sp-item').forEach(x=>x.classList.toggle('on',x.dataset.v===v));sortPop.classList.remove('open');reFilter();}
fetch('products_list.json').then(r=>r.json()).then(d=>{DATA=d;$('loading').style.display='none';initFilters();restoreOrRender();})
  .catch(e=>{$('loading').textContent='載入失敗：'+e;});
// 記住捲動位置/分頁/篩選,從商品頁按返回時回到原位
function saveState(){try{sessionStorage.setItem('shopState',JSON.stringify({y:window.scrollY,page:curPage,brand:selBrand,bl:selBrandLabel,cat:selCat,q:searchQ,gen:genSel.value,sort:sortVal,sale:onlySale}));}catch(e){}}
function restoreOrRender(){
  let s=null;try{s=JSON.parse(sessionStorage.getItem('shopState')||'null');}catch(e){}
  if(s){selBrand=s.brand||'';selBrandLabel=s.bl||'';selCat=s.cat||'';searchQ=s.q||'';if(searchQ)$('searchInput').value=searchQ;buildBrandList('');buildCatList();genSel.value=s.gen||'';sortVal=s.sort||'new';document.querySelectorAll('.sp-item').forEach(x=>x.classList.toggle('on',x.dataset.v===sortVal));onlySale=!!s.sale;saleT.classList.toggle('on',onlySale);curPage=s.page||1;render();
    let tries=0;(function sc(){window.scrollTo(0,s.y||0);if(++tries<10&&Math.abs(window.scrollY-(s.y||0))>4)requestAnimationFrame(sc);})();
  }else{render();}
}
async function loadDetail(p){
  if(!(p.sh in SHARDS)){
    try{SHARDS[p.sh]=await fetch('detail/detail_'+p.sh+'.json').then(r=>r.json());}
    catch(e){SHARDS[p.sh]={};}
  }
  return SHARDS[p.sh][p.id]||{images:[p.img],size_chart:null};
}
// 聯名 A×B / A x B / A|B / A for B → 取第一個品牌 A
function brandBase(b){return (b||'').split(/\s*[×✕✖╳/｜|]\s*|\s+x\s+|\s+for\s+/i)[0].trim();}
// 正規化比對鍵:大寫、去彎/直引號與所有標點空白 (ARC'TERYX 與 ARC’TERYX 都→ARCTERYX)
function brandKey(b){return brandBase(b).toUpperCase().replace(/[^A-Z0-9]/g,'');}
function initFilters(){
  buildCatList();
  const bmap={};
  DATA.forEach(p=>{const k=brandKey(p.brand);if(!k)return;const lab=brandBase(p.brand);(bmap[k]=bmap[k]||{});bmap[k][lab]=(bmap[k][lab]||0)+1;});
  ALL_BRANDS=Object.keys(bmap).map(k=>{const labs=bmap[k];const label=Object.keys(labs).sort((a,b)=>labs[b]-labs[a]||a.length-b.length)[0];return {key:k,label};})
    .sort((a,b)=>a.label.toUpperCase()<b.label.toUpperCase()?-1:1);
  buildBrandList('');
}
function buildCatList(){
  const cats=[...new Set(DATA.map(p=>p.cat).filter(Boolean))].sort();
  let html=`<div class="menu-item ${selCat===''?'on':''}" data-v="">全部分類</div>`;
  html+=cats.map(c=>`<div class="menu-item ${selCat===c?'on':''}" data-v="${c}">${c}</div>`).join('');
  catList.innerHTML=html;
  catList.querySelectorAll('.menu-item').forEach(el=>el.onclick=()=>pickCat(el.getAttribute('data-v')));
}
function buildBrandList(q){
  q=(q||'').trim().toUpperCase();
  const items=ALL_BRANDS.filter(o=>!q||o.label.toUpperCase().startsWith(q));
  let html=`<div class="menu-item ${selBrand===''?'on':''}" data-k="">全部品牌</div>`;
  html+=items.map(o=>`<div class="menu-item ${selBrand===o.key?'on':''}" data-k="${o.key}" data-l="${o.label.replace(/"/g,'&quot;')}">${o.label}</div>`).join('');
  if(!items.length)html+=`<div class="menu-item" style="color:#aaa">找不到品牌</div>`;
  brandList.innerHTML=html;
  brandList.querySelectorAll('.menu-item[data-k]').forEach(el=>el.onclick=()=>pickBrand(el.getAttribute('data-k'),el.getAttribute('data-l')||''));
}
// 搜尋/品牌/分類互斥:選其中一個會清掉其他(不連動)
function pickBrand(k,label){selBrand=k;selBrandLabel=label||'';selCat='';searchQ='';$('searchInput').value='';buildBrandList('');buildCatList();closeMenu();reFilter();}
function pickCat(v){selCat=v;selBrand='';selBrandLabel='';searchQ='';$('searchInput').value='';buildCatList();buildBrandList('');closeMenu();reFilter();}
function doSearch(){searchQ=$('searchInput').value.trim();selBrand='';selBrandLabel='';selCat='';buildBrandList('');buildCatList();closeMenu();reFilter();}
function showMenu(id){document.querySelectorAll('.menu-view').forEach(v=>v.style.display='none');$(id).style.display='flex';}
function openMenu(){menuOverlay.classList.add('open');showMenu('menuRoot');document.body.style.overflow='hidden';}
function closeMenu(){menuOverlay.classList.remove('open');document.body.style.overflow='';}
function render(){
  let list=DATA.slice();
  if(onlySale)list=list.filter(p=>p.on_sale);
  if(selCat)list=list.filter(p=>p.cat===selCat);
  if(searchQ){const q=searchQ.toLowerCase();list=list.filter(p=>((p.title||'')+' '+(p.brand||'')+' '+(p.cat||'')).toLowerCase().indexOf(q)>-1);}
  if(genSel.value){const gv=genSel.value;list=list.filter(p=>gv==='生活'?p.g==='生活':(p.g===gv||p.g==='男女通用'));}
  if(selBrand){list=list.filter(p=>brandKey(p.brand)===selBrand);}
  const s=sortVal;
  if(s==='off')list.sort((a,b)=>pct(b)-pct(a));
  else if(s==='plow')list.sort((a,b)=>a.price-b.price);
  else if(s==='phigh')list.sort((a,b)=>b.price-a.price);
  view=list;
  const pages=Math.max(1,Math.ceil(list.length/PER));
  if(curPage>pages)curPage=1;
  const start=(curPage-1)*PER, pageItems=list.slice(start,start+PER);
  const fchips=[searchQ?('搜尋:'+searchQ):'',selBrandLabel?('品牌:'+selBrandLabel):'',selCat?('分類:'+selCat):''].filter(Boolean).join(' · ');
  countEl.textContent=`共 ${list.length} 件`+(fchips?' · '+fchips:'')+(onlySale?'（特價中）':'')+(pages>1?` · 第 ${curPage}/${pages} 頁`:'');
  grid.innerHTML=pageItems.map((p,ii)=>{const i=start+ii;
    const off=pct(p);
    const ims=(p.imk&&p.imk.length?p.imk:[p.img]).slice(0,10);
    const slides=ims.map((fn,j)=>`<img loading="lazy" ${j===0?'src':'data-src'}="${cimg(p,fn)}">`).join('');
    const nav=ims.length>1?`<button class="cg-nav prev" type="button" onclick="cgScroll(event,this,-1)">‹</button><button class="cg-nav next" type="button" onclick="cgScroll(event,this,1)">›</button><span class="cg-count">1/${ims.length}</span>`:'';
    const ph=off>0?`<span class="now sale">${yen(p.price)}</span><span class="was">${yen(p.orig)}</span><span class="off">-${off}%</span>`:`<span class="now">${yen(p.price)}</span>`;
    return `<a class="card" href="p/${p.id}.html" onclick="saveState()" style="text-decoration:none;color:inherit"><div class="thumb">${off>0?`<span class="badge">-${off}%</span>`:''}${p.cat?`<span class="cat-tag">${p.cat}</span>`:''}
      <div class="cg-strip" onscroll="onStrip(this)">${slides}</div>${nav}</div>
      <div class="info"><div class="brand">${p.brand||''}</div><div class="name">${p.title||''}</div>
      <div class="price">${ph}</div></div></a>`;
  }).join('');
  renderPager(pages);
  window.scrollTo(0,0);
}
function renderPager(pages){
  const pager=$('pager');
  if(pages<=1){pager.innerHTML='';return;}
  let btns=`<button ${curPage===1?'disabled':''} onclick="goPage(${curPage-1})">‹</button>`;
  const win=2; const nums=new Set([1,pages]);
  for(let n=curPage-win;n<=curPage+win;n++){if(n>=1&&n<=pages)nums.add(n);}
  const sorted=[...nums].sort((a,b)=>a-b); let prev=0;
  for(const n of sorted){
    if(prev&&n-prev>1)btns+=`<span class="pinfo">…</span>`;
    btns+=`<button class="${n===curPage?'on':''}" onclick="goPage(${n})">${n}</button>`;prev=n;
  }
  btns+=`<button ${curPage===pages?'disabled':''} onclick="goPage(${curPage+1})">›</button>`;
  pager.innerHTML=btns;
}
function goPage(n){curPage=n;render();saveState();}
function chartHtml(sc){
  if(!sc||!sc.rows||!sc.rows.length)return '';
  const th=sc.headers.map(h=>`<th>${h}</th>`).join('');
  const tb=sc.rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  return `<div class="m-sec"><div class="m-label"><b>尺寸表</b>（cm）</div><div class="m-chart-wrap"><table class="m-chart"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div></div>`;
}
async function openM(i){
  const p=view[i],off=pct(p),c=cols(p);
  modal.classList.add('open');document.body.style.overflow='hidden';
  sheet.innerHTML=`<div style="padding:60px;text-align:center;color:#999;grid-column:1/-1">載入中…</div>`;
  const detail=await loadDetail(p);
  const imgs=(detail.images&&detail.images.length)?detail.images:[p.img];
  const chart=detail.size_chart;
  const ph=off>0?`<span class="m-now sale">${yen(p.price)}</span><span class="m-was">${yen(p.orig)}</span><span class="m-off">-${off}%</span>`:`<span class="m-now">${yen(p.price)}</span>`;
  const colHtml=c.length?`<div class="m-sec"><div class="m-label">顏色：<b class="selVal" data-g="c">${c[0]}</b></div><div class="m-opts">${c.map((x,j)=>`<span class="m-opt${j===0?' first':''}" onclick="selOpt(this,'c')">${x}</span>`).join('')}</div></div>`:'';
  const szHtml=(p.sizes&&p.sizes.length)?`<div class="m-sec"><div class="m-label">尺寸：<b class="selVal" data-g="s">${p.sizes[0]}</b></div><div class="m-opts">${p.sizes.map((x,j)=>`<span class="m-opt${j===0?' first':''}" onclick="selOpt(this,'s')">${x}</span>`).join('')}</div></div>`:'';
  const thumbs=imgs.map((im,j)=>`<div class="thumb-item"><img src="${im}" class="${j===0?'sel':''}" onclick="swap(this,'${im}')">${j<c.length?`<div class="thumb-cap">${c[j]}</div>`:''}</div>`).join('');
  sheet.innerHTML=`<div class="m-gallery"><div class="m-main"><img id="mMain" src="${imgs[0]}"></div><div class="m-thumbs">${thumbs}</div></div>
    <div class="m-info"><button class="m-close" onclick="closeM()">×</button>
    <div class="m-brand">${p.brand||''}${p.cat?' · '+p.cat:''}</div><div class="m-name">${p.title||''}</div>
    <div class="m-price">${ph}</div><div class="m-sku">商品編號：${p.id||''}</div>
    ${colHtml}${szHtml}${chartHtml(chart)}
    <a class="m-cta" href="${LINE_URL}" target="_blank" rel="noopener">送出訂購單（轉導LINE）</a>
    <a class="m-perma" href="p/${p.id}.html" style="display:block;text-align:center;margin-top:10px;color:#8a8a8a;font-size:12px;text-decoration:none">🔗 商品專頁（可分享網址）</a></div>`;
}
function selOpt(el,g){[...el.parentElement.children].forEach(t=>t.classList.remove('first'));el.classList.add('first');const l=document.querySelector(`.selVal[data-g="${g}"]`);if(l)l.textContent=el.textContent;}
function swap(el,src){$('mMain').src=src;document.querySelectorAll('.m-thumbs img').forEach(t=>t.classList.remove('sel'));el.classList.add('sel');}
function closeM(){modal.classList.remove('open');document.body.style.overflow='';}
modal.onclick=e=>{if(e.target===modal)closeM();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
function reFilter(){curPage=1;render();saveState();}
let _scrollSaveT;window.addEventListener('scroll',()=>{clearTimeout(_scrollSaveT);_scrollSaveT=setTimeout(saveState,300);});
saleT.onclick=()=>{onlySale=!onlySale;saleT.classList.toggle('on',onlySale);reFilter();};
genSel.onchange=reFilter;
sortBtn.onclick=e=>{e.stopPropagation();sortPop.classList.toggle('open');};
sortPop.onclick=e=>e.stopPropagation();
// 左側漢堡選單
$('menuBtn').onclick=openMenu;
$('menuClose').onclick=closeMenu;
function goHome(){try{sessionStorage.removeItem('shopState');}catch(e){}location.href='index.html';}
$('mHome').onclick=goHome;
$('searchBtn').onclick=doSearch;
$('searchInput').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
$('mBrandOpen').onclick=()=>{brandInput.value='';buildBrandList('');showMenu('menuBrand');};
$('mCatOpen').onclick=()=>{buildCatList();showMenu('menuCat');};
menuOverlay.addEventListener('click',e=>{if(e.target===menuOverlay)closeMenu();});
brandInput.oninput=()=>buildBrandList(brandInput.value);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.addEventListener('click',e=>{if(!$('sortBtn').contains(e.target)&&!sortPop.contains(e.target))sortPop.classList.remove('open');});
</script>
<script src="cart.js?v=3"></script>
