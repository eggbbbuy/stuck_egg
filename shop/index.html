<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>選品倉庫 · Daytona 新品／特價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#e0281e;--ink:#111;--sub:#8a8a8a;--line:#eee;--bg:#fafafa;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .head-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo{font-weight:800;font-size:20px;letter-spacing:.5px;}
  .logo small{font-weight:500;color:var(--sub);font-size:12px;margin-left:8px;}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,.toggle{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:999px;background:#fff;cursor:pointer;color:var(--ink);}
  .toggle.on{background:var(--red);color:#fff;border-color:var(--red);}
  .count{font-size:12px;color:var(--sub);width:100%;max-width:1280px;margin:0 auto;padding:8px 20px 0;}
  main{max-width:1280px;margin:0 auto;padding:14px 16px 60px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px;}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}
  @media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr);}}
  .card{background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid #f0f0f0;transition:.18s;display:flex;flex-direction:column;}
  .card:hover{box-shadow:0 8px 24px rgba(0,0,0,.09);transform:translateY(-2px);}
  .thumb{position:relative;aspect-ratio:1/1.18;background:#f3f3f3;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s;}
  .thumb img.alt{position:absolute;inset:0;opacity:0;}
  .card:hover .thumb img.alt{opacity:1;}
  .badge{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;letter-spacing:.5px;}
  .info{padding:11px 12px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .brand{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .name{font-size:13px;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
  .colors{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  .cchip{font-size:10px;color:#777;background:#f3f3f3;padding:2px 6px;border-radius:5px;}
  .price{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .now{font-weight:700;font-size:16px;}
  .now.sale{color:var(--red);}
  .was{font-size:12px;color:#aaa;text-decoration:line-through;}
  .off{font-size:11px;font-weight:700;color:var(--red);}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:30px;}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="logo">選品倉庫<small>Daytona 新品 · 特價追蹤</small></div>
    <div class="controls">
      <div class="toggle" id="saleToggle">🔥 只看特價</div>
      <select id="brandSel"></select>
      <select id="sortSel">
        <option value="new">預設(新到舊)</option>
        <option value="off">折扣多→少</option>
        <option value="plow">價格低→高</option>
        <option value="phigh">價格高→低</option>
      </select>
    </div>
  </div>
  <div class="count" id="count"></div>
</header>
<main><div class="grid" id="grid"></div></main>
<footer>資料來源：Daytona Park（示範用）· 價格以官網為準</footer>

const grid=document.getElementById('grid'), brandSel=document.getElementById('brandSel'),
      sortSel=document.getElementById('sortSel'), saleT=document.getElementById('saleToggle'), countEl=document.getElementById('count');
let onlySale=false;
const brands=[...new Set(DATA.map(p=>p.brand).filter(Boolean))].sort();
brandSel.innerHTML='<option value="">全部品牌</option>'+brands.map(b=>`<option value="${b}">${b}</option>`).join('');
const yen=n=>'¥'+Number(n).toLocaleString();
function pct(p){return p.orig&&p.price&&p.orig>p.price?Math.round((1-p.price/p.orig)*100):0;}
function render(){
  let list=DATA.slice();
  if(onlySale) list=list.filter(p=>p.on_sale);
  const bv=brandSel.value; if(bv) list=list.filter(p=>p.brand===bv);
  const s=sortSel.value;
  if(s==='off') list.sort((a,b)=>pct(b)-pct(a));
  else if(s==='plow') list.sort((a,b)=>a.price-b.price);
  else if(s==='phigh') list.sort((a,b)=>b.price-a.price);
  countEl.textContent=`共 ${list.length} 件`+(onlySale?'（特價中）':'');
  grid.innerHTML=list.map(p=>{
    const off=pct(p);
    const img0=p.images[0], img1=p.images[1]||p.images[0];
    const cols=(p.colors||[]).slice(0,4).map(c=>`<span class="cchip">${c}</span>`).join('')+((p.colors||[]).length>4?`<span class="cchip">+${p.colors.length-4}</span>`:'');
    const priceHtml=off>0
      ? `<span class="now sale">${yen(p.price)}</span><span class="was">${yen(p.orig)}</span><span class="off">-${off}%</span>`
      : `<span class="now">${yen(p.price)}</span>`;
    return `<a class="card" href="${p.url}" target="_blank" rel="noopener">
      <div class="thumb">${off>0?`<span class="badge">-${off}%</span>`:''}
        <img loading="lazy" src="${img0}"><img class="alt" loading="lazy" src="${img1}"></div>
      <div class="info"><div class="brand">${p.brand||''}</div>
        <div class="name">${p.title||''}</div>
        <div class="colors">${cols}</div>
        <div class="price">${priceHtml}</div></div></a>`;
  }).join('');
}
saleT.onclick=()=>{onlySale=!onlySale;saleT.classList.toggle('on',onlySale);render();};
brandSel.onchange=render; sortSel.onchange=render;
render();
</script>
