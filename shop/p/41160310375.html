<script>
function pmove(d){var ps=document.getElementById('pstrip');ps.scrollBy({left:d*ps.clientWidth,behavior:'smooth'});}
var LBsrcs=[],LBi=0;
function lbOpen(i){LBi=i;document.getElementById('lbImg').src=LBsrcs[i];document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden';}
function lbClose(){document.getElementById('lb').classList.remove('open');document.body.style.overflow='';}

(function(){
  var ps=document.getElementById('pstrip'),ths=[].slice.call(document.querySelectorAll('.thumbs img')),pc=document.getElementById('pcount');
  LBsrcs=[].map.call(ps.querySelectorAll('img'),function(im){return im.getAttribute('src')||im.getAttribute('data-src');});
  ths.forEach(function(t,j){t.onclick=function(){ps.scrollTo({left:j*ps.clientWidth,behavior:'smooth'});};});
  ps.addEventListener('scroll',function(){var j=Math.round(ps.scrollLeft/ps.clientWidth);ths.forEach(function(x,k){x.classList.toggle('sel',k===j);});if(pc)pc.textContent=(j+1)+'/'+ps.children.length;});
  ps.addEventListener('click',function(){if(window.innerWidth>720)lbOpen(Math.round(ps.scrollLeft/ps.clientWidth));});
  var lb=document.getElementById('lb');
  lb.addEventListener('click',function(e){if(e.target===lb)lbClose();});
  document.getElementById('lbClose').addEventListener('click',lbClose);
